<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mood Radio</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0);
    }

    body {
      font-family: Arial, sans-serif;
      background: rgba(0, 0, 0, 0);
      color: white;
    }


    /* =================================
       CONTROLADOR — IPHONE
       ================================= */

    #controller {
      width: 100%;
      min-height: 100vh;
      padding: 22px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .controller-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .controller-subtitle {
      opacity: 0.55;
      margin-bottom: 25px;
    }

    .buttons {
      width: 100%;
      max-width: 430px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .mood-button {
      border: none;
      border-radius: 18px;

      min-height: 85px;

      background: #292929;
      color: white;

      font-size: 19px;
      font-weight: 800;

      transition:
        transform 0.08s,
        background 0.15s;
    }

    .mood-button:active {
      transform: scale(0.94);
      background: #444;
    }

    .current-mood {
      margin-top: 25px;
      opacity: 0.7;
      font-size: 15px;
    }

    #currentMood {
      font-weight: 900;
      color: white;
    }


    /* =================================
       DISPLAY — IPAD / PRISM
       ================================= */

    #display {
      width: 100%;
      height: 100vh;

      background: transparent;

      position: relative;
      overflow: hidden;
    }


    /* =================================
       WIDGET
       ================================= */

    .radio-widget {
      position: absolute;

      right: 25px;
      bottom: 25px;

      width: 190px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }


    /* =================================
       PERSONAJE / GIF
       ================================= */

    .character {
      height: auto;

      display: block;

      margin-bottom: 8px;

      user-select: none;
    }


    /* =================================
       RADIO
       ================================= */

    .radio {
      font-size: 34px;

      line-height: 1;

      margin-bottom: 7px;

      user-select: none;
    }


    /* =================================
       TEXTO
       ================================= */

    .request-text {
      font-size: 13px;

      font-weight: 800;

      letter-spacing: 0.5px;

      text-shadow:
        0 2px 5px rgba(0, 0, 0, 0.9);

      white-space: nowrap;
    }

    .mood-name {
      margin-top: 5px;

      font-size: 11px;

      font-weight: 900;

      opacity: 0.65;

      letter-spacing: 2px;

      text-shadow:
        0 2px 5px rgba(0, 0, 0, 0.9);
    }


    /* =================================
       EFECTO DE CAMBIO DE MOOD
       ================================= */

    .change {
      animation: moodChange 0.25s ease;
    }

    @keyframes moodChange {

      0% {
        transform: scale(0.85);
        opacity: 0.3;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }

    }


    /* =================================
       MÓVIL
       ================================= */

    @media (max-width: 500px) {

      .radio-widget {
        right: 15px;
        bottom: 15px;

        width: 160px;
      }

      .radio {
        font-size: 30px;
      }

      .request-text {
        font-size: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- =================================
       CONTROLADOR
       ================================= -->

  <div id="controller" style="display:none;">

    <div class="controller-title">
      📻 MOOD RADIO
    </div>

    <div class="controller-subtitle">
      Elegí el mood del stream
    </div>


    <div class="buttons">

      <button class="mood-button" data-mood="HOPE">
        🌱<br>
        HOPE
      </button>

      <button class="mood-button" data-mood="SAD">
        💧<br>
        SAD
      </button>

      <button class="mood-button" data-mood="CHILL">
        🌙<br>
        CHILL
      </button>

      <button class="mood-button" data-mood="VOID">
        🕳️<br>
        VOID
      </button>

      <button class="mood-button" data-mood="HYPE">
        🔥<br>
        HYPE
      </button>

      <button class="mood-button" data-mood="SLEEP">
        😴<br>
        SLEEP
      </button>

    </div>


    <div class="current-mood">

      Mood actual:

      <span id="currentMood">
        CHILL
      </span>

    </div>

  </div>


  <!-- =================================
       DISPLAY
       ================================= -->

  <div id="display" style="display:none;">

    <div class="radio-widget">


      <!-- GIF DEL PERSONAJE -->

      <img
        id="character"
        class="character"
        src="./void.gif"
        alt=""
        style="width: 180px;"
      >


      <!-- RADIO -->

      <div class="radio">
        📻
      </div>


      <!-- TEXTO -->

      <div class="request-text">
        solicita tu mood bro
      </div>


      <!-- MOOD ACTUAL -->

      <div
        id="displayMood"
        class="mood-name"
      >
        VOID
      </div>

    </div>

  </div>


  <!-- =================================
       SUPABASE
       ================================= -->

  <script type="module">

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* =================================
       CONFIGURACIÓN
       ================================= */

    const SUPABASE_URL =
      "https://wdxxeoiweusygdnoylaz.supabase.co";


    /*
     * PEGÁ AQUÍ TU MISMA CLAVE
     * sb_publishable_...
     */

    const SUPABASE_KEY =
      "sb_publishable_VEDli7KJZdAhpMlqvYul4Q_uAvFdiFo";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =================================
       MODO
       ================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const mode =
      params.get("mode") || "display";


    /* =================================
       SALA
       ================================= */

    const room =
      params.get("room") ||
      "mood-radio-345-test";


    /* =================================
       CANAL SUPABASE
       ================================= */

    const channel =
      supabase.channel(room);


    /* =================================
       GIFS
       ================================= */

    const gifs = {

      SAD: "./sad.gif",

      VOID: "./void.gif"

    };


    /* =================================
       TAMAÑOS INDIVIDUALES
       =================================
       
       Cada mood puede tener
       un tamaño diferente.

       Estos son nuestros valores
       iniciales de prueba.
       ================================= */

    const gifSizes = {

      SAD: 165,

      VOID: 180

    };


    /* =================================
       MOSTRAR MOOD
       ================================= */

    function showMood(mood) {

      const character =
        document.getElementById(
          "character"
        );

      const displayMood =
        document.getElementById(
          "displayMood"
        );


      if (!character || !displayMood) {
        return;
      }


      /*
       * Quitamos la animación anterior.
       */

      character.classList.remove(
        "change"
      );


      /*
       * Forzamos al navegador
       * a reiniciar la animación.
       */

      void character.offsetWidth;


      /*
       * Cambiamos el GIF.
       */

      if (gifs[mood]) {

        character.src =
          gifs[mood];

      }


      /*
       * Cambiamos el tamaño
       * específico del mood.
       */

      if (gifSizes[mood]) {

        character.style.width =
          gifSizes[mood] + "px";

      }


      /*
       * Cambiamos el nombre
       * del mood debajo.
       */

      displayMood.textContent =
        mood;


      /*
       * Volvemos a activar
       * la animación de cambio.
       */

      character.classList.add(
        "change"
      );

    }


    /* =================================
       CONTROLADOR — IPHONE
       ================================= */

    if (mode === "control") {

      document
        .getElementById("controller")
        .style.display = "flex";


      document
        .querySelectorAll(
          ".mood-button"
        )
        .forEach(button => {


          button.addEventListener(
            "click",
            async () => {


              const mood =
                button.dataset.mood;


              /*
               * Actualizamos el mood
               * mostrado en el iPhone.
               */

              document
                .getElementById(
                  "currentMood"
                )
                .textContent =
                mood;


              /*
               * Enviamos el mood
               * al iPad mediante Supabase.
               */

              await channel.send({

                type: "broadcast",

                event: "mood",

                payload: {
                  mood: mood
                }

              });

            }
          );

        });

    }


    /* =================================
       DISPLAY — IPAD
       ================================= */

    else {

      document
        .getElementById("display")
        .style.display = "block";

    }


    /* =================================
       ESCUCHAR MOODS
       ================================= */

    channel
      .on(
        "broadcast",
        {
          event: "mood"
        },
        ({ payload }) => {


          if (
            payload &&
            payload.mood
          ) {

            showMood(
              payload.mood
            );

          }

        }
      )
      .subscribe();


  </script>

</body>

</html>
